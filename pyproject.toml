[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-site"
version = "0.1.0"
description = "Flask résumé site"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies are managed in requirements.txt, not here.

[tool.setuptools]
include-package-data = true

# Tell setuptools where to find your package
[tool.setuptools.packages.find]
where = ["."]
include = ["resume_site*"]

# Ensure templates/static are installed with the package
[tool.setuptools.package-data]
"resume_site" = ["templates/**", "static/**"]