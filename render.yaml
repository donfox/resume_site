services:
  - type: web
    name: resume-site
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app -w 2 -k gthread --threads 8 --timeout 60
      --graceful-timeout 30 -b 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resume-site-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_MAIL_SERVER
        sync: false
      - key: BREVO_MAIL_USERNAME
        sync: false
      - key: BREVO_MAIL_PASSWORD
        sync: false
      - key: BREVO_MAIL_PORT
        sync: false
      - key: BREVO_MAIL_TIMEOUT
        sync: false
      - key: BREVO_MAIL_USE_TLS
        sync: false
      - key: BREVO_MAIL_DEFAULT_SENDER
        sync: false
      - key: BREVO_API_KEY
        sync: false

databases:
  - name: resume-site-db
    databaseName: resume_site
    user: resume_site_user
    plan: free
