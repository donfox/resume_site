services:
  - type: web
    name: resume_site
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app -w 2 -k gthread --threads 8 --timeout 60
      --graceful-timeout 30 -b 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Set by hand in the Render dashboard to the Postgres instance's
      # Internal Database URL; the database itself is managed outside this file.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

